<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAPTER 21 // HOUSE OF BALLOONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: rgba(18, 18, 22, 0.75);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #ffffff;
      --spotify: #1ed760;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .balloon {
      position: fixed;
      border-radius: 50%;
      filter: blur(45px);
      z-index: 1;
      opacity: 0.18;
      pointer-events: none;
      animation: float 14s infinite ease-in-out alternate;
    }

    .balloon-1 {
      width: 280px;
      height: 340px;
      background: radial-gradient(circle, #ffffff 0%, transparent 70%);
      top: -60px;
      left: -80px;
    }

    .balloon-2 {
      width: 320px;
      height: 380px;
      background: radial-gradient(circle, #3f3f46 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      animation-duration: 18s;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(45px) rotate(8deg); }
    }

    .card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: 2.3rem;
      line-height: 1.05;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      margin-bottom: 30px;
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      padding: 20px 0;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.88rem;
    }

    .detail-label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
    }

    .detail-value {
      font-weight: 600;
      text-align: right;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border: 1px solid var(--accent);
    }
