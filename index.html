<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHAPTER 21 // HOUSE OF BALLOONS</title>
  
  <meta property="og:title" content="CHAPTER 21 // HOUSE OF BALLOONS">
  <meta property="og:description" content="This is a happy house. Oct 30 • 19:00 — Late.">
  <meta name="theme-color" content="#070709">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #070709;
      color: #ffffff;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      position: relative;
    }

    /* Фоновые градиенты */
    .glow-sphere {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      filter: blur(60px);
      transform: translateZ(0);
      will-change: transform;
      animation: ambientPulse 8s infinite alternate ease-in-out;
    }

    .glow-red {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.28) 0%, transparent 70%);
      top: -30px;
      right: -40px;
    }

    .glow-white {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
      bottom: -40px;
      left: -50px;
      animation-delay: -4s;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.7; }
      100% { transform: scale(1.15) translate(10px, -15px); opacity: 1; }
    }

    /* Анимированные шары (Строго ч/б) */
    .balloon-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -6px -6px 20px rgba(0, 0, 0, 0.9), 0 8px 25px rgba(0, 0, 0, 0.7);
      animation: float 10s infinite ease-in-out alternate;
      will-change: transform;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 6px solid rgba(255, 255, 255, 0.35);
    }

    /* Белый шар */
    .balloon-1 {
      width: 110px;
      height: 135px;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #3f3f46 70%, #09090b 100%);
      top: 5%;
      left: 3%;
      opacity: 0.42;
      animation-duration: 13s;
    }

    /* Черный глубокий шар */
    .balloon-2 {
      width: 100px;
      height: 125px;
      background: radial-gradient(circle at 35% 30%, #52525b 0%, #18181b 60%, #000000 100%);
      bottom: 8%;
      right: 4%;
      opacity: 0.38;
      animation-duration: 11s;
      animation-delay: -2s;
    }

    /* Серебристо-дымчатый шар */
    .balloon-3 {
      width: 82px;
      height: 105px;
      background: radial-gradient(circle at 35% 30%, #e4e4e7 0%, #27272a 75%, #050507 100%);
      top: 52%;
      left: -15px;
      opacity: 0.32;
      animation-duration: 15s;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-20px) rotate(4deg); }
      100% { transform: translateY(10px) rotate(-2deg); }
    }

    /* Карточка с анимацией входа */
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(20, 20, 25, 0.94) 0%, rgba(10, 10, 13, 0.97) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 32px 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      animation: fadeIn 0.8s ease backwards;
      animation-delay: 0.2s;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #f4f4f5;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .bpm {
      font-size: 0.65rem;
      color: #71717a;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Заголовок */
    .title {
      font-family: 'Syne', sans-serif;
      font-size: 2.25rem;
      line-height: 1.02;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 40%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      animation: fadeIn 0.8s ease backwards;
      animation-delay: 0.3s;
    }

    .subtitle {
      color: #8e8e98;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 22px;
      animation: fadeIn 0.8s ease backwards;
      animation-delay: 0.4s;
    }

    /* Блок расписания и адреса */
    .info-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
      animation: fadeIn 0.8s ease backwards;
      animation-delay: 0.5s;
    }

    .status-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e11d48;
      box-shadow: 0 0 10px #e11d48;
      margin-right: 8px;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px #e11d48; }
    }

    .status-left {
      display: flex;
      align-items: center;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d4d4d8;
      font-weight: 600;
    }

    .status-right {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    .status-right.mystery {
      color: #e11d48;
      letter-spacing: 0.2em;
      font-weight: 800;
      animation: neonFlicker 3s infinite alternate;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 0 0 6px rgba(225, 29, 72, 0.8), 0 0 12px rgba(225, 29, 72, 0.4);
        opacity: 1;
      }
      20%, 24%, 55% {
        text-shadow: none;
        opacity: 0.4;
      }
    }

    /* Кнопки */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.8s ease backwards;
      animation-delay: 0.6s;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
      touch-action: manipulation;
      overflow: hidden;
      transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .btn-primary {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.15);
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      animation: sweep 4.5s infinite;
    }

    @keyframes sweep {
      0%, 65% { left: -100%; }
      100% { left: 160%; }
    }

    .btn-primary:active {
      transform: scale(0.97);
      background: #e4e4e7;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .footer-quote {
      margin-top: 24px;
      text-align: center;
      font-size: 0.7rem;
      color: #52525b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: fadeIn 0.8s ease backwards;
      animation-delay: 0.7s;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
