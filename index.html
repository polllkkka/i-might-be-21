<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAPTER 21 // HOUSE OF BALLOONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0e;
      color: #ffffff;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      text-align: left;
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a1a1aa;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      line-height: 1.05;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b8b94;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      margin-bottom: 28px;
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      padding: 18px 0;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.88rem;
    }

    .detail-label {
      color: #71717a;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }

    .detail-value {
      font-weight: 600;
      text-align: right;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-primary {
      background: #ffffff;
      color: #000000;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #1f1f26;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    .footer-quote {
      margin-top: 24px;
      text-align: center;
      font-size: 0.75rem;
      color: #52525b;
      font-style: italic;
      letter-spacing: 0.04em;
    }
  </style>
</head>
